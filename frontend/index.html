<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="origin">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/ezservice logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before the page paints (avoids a white flash in dark mode)
      try {
        var t = localStorage.getItem('ez-theme');
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <title>EZService · Book trusted local professionals</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
